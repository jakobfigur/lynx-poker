[project]
name = "pokercollector"
version = "0.1.0"
description = "Visuelle Erfassung, Rekonstruktion und Auswertung von PokerTH-Web-Partien"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "mss>=9.0",
    "torch>=2.4",
    "numba>=0.60",
    "pillow>=10.0",
    "winrt-runtime>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
]

[project.scripts]
pokercollector = "pokercollector.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokercollector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
